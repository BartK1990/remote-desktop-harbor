<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Remote Desktop Harbor app icon: a remote screen with a harbor anchor. Source for AppIcon.ico (see build-icon.cjs). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C9BE6"/>
      <stop offset="1" stop-color="#0A3F78"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E4C86"/>
      <stop offset="1" stop-color="#072B52"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- monitor -->
  <rect x="38" y="50" width="180" height="126" rx="16" fill="#FFFFFF"/>
  <rect x="52" y="64" width="152" height="98" rx="7" fill="url(#screen)"/>
  <rect x="114" y="176" width="28" height="18" fill="#FFFFFF"/>
  <rect x="80" y="190" width="96" height="16" rx="8" fill="#FFFFFF"/>
  <!-- anchor -->
  <g fill="none" stroke="#8FDcFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="128" cy="83" r="8"/>
    <line x1="128" y1="91" x2="128" y2="147"/>
    <line x1="112" y1="104" x2="144" y2="104"/>
    <path d="M98 124 Q100 147 128 147 Q156 147 158 124"/>
  </g>
  <g fill="#8FDCFF">
    <path d="M90 128 L106 128 L98 116 Z"/>
    <path d="M150 128 L166 128 L158 116 Z"/>
  </g>
</svg>
