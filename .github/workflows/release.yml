name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v (e.g. 0.2.0). Creates tag v<version>."
        required: true

permissions:
  contents: write
  # SignPath reads the job details and downloads the unsigned artifact with the job token (ADR-0032).
  actions: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $v = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}".TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Invalid version '$v'" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test RemoteDesktopHarbor.slnx -c Release

      - name: Publish self-contained (no runtime needed)
        run: >
          dotnet publish src/Harbor.App/Harbor.App.csproj -p:PublishProfile=win-x64
          -p:Version=${{ steps.version.outputs.version }} -o out/sc

      - name: Publish framework-dependent (needs .NET 10 Desktop Runtime)
        run: >
          dotnet publish src/Harbor.App/Harbor.App.csproj -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:DebugType=embedded
          -p:Version=${{ steps.version.outputs.version }} -o out/fdd

      - name: Remove symbols
        shell: pwsh
        run: Get-ChildItem out -Recurse -Filter *.pdb | Remove-Item

      # Code signing via SignPath Foundation (SPEC NFR-06, ADR-0032). Runs only once the repository variable
      # SIGNPATH_ORGANIZATION_ID is set; until then the release is published unsigned, as before.
      # The artifact contains sc/RemoteDesktopHarbor.exe and fdd/RemoteDesktopHarbor.exe; its layout must match
      # the artifact configuration in .signpath/artifact-configuration.xml.
      - name: Upload unsigned exes for signing
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: |
            out/sc/RemoteDesktopHarbor.exe
            out/fdd/RemoteDesktopHarbor.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'remote-desktop-harbor' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Release signing waits for a manual approval in SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Use signed exes
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          foreach ($d in @("sc", "fdd")) {
            $exe = "signed/$d/RemoteDesktopHarbor.exe"
            $sig = Get-AuthenticodeSignature $exe
            if ($sig.Status -ne "Valid") { throw "$exe is not validly signed: $($sig.Status) $($sig.StatusMessage)" }
            "$d signed by: $($sig.SignerCertificate.Subject)"
            Copy-Item $exe -Destination "out/$d/RemoteDesktopHarbor.exe" -Force
          }

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($d in @("sc", "fdd")) {
            Copy-Item README.md -Destination "out/$d"
          }
          Compress-Archive -Path out/sc/* -DestinationPath "dist/RemoteDesktopHarbor-$v-win-x64.zip"
          Compress-Archive -Path out/fdd/* -DestinationPath "dist/RemoteDesktopHarbor-$v-win-x64-requires-dotnet10.zip"
          Get-ChildItem dist/*.zip | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content dist/SHA256SUMS.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          # Build the argument list explicitly: an empty "" argument would be taken by gh as an asset path.
          $ghArgs = @("release", "create", "v$v", "--title", "Remote Desktop Harbor $v", "--generate-notes", "--target", "${{ github.sha }}")
          if ($v -match '-') { $ghArgs += "--prerelease" }
          $ghArgs += (Get-ChildItem dist -File).FullName
          gh @ghArgs
