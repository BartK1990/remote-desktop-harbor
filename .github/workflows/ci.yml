name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore RemoteDesktopHarbor.slnx

      - name: Build
        run: dotnet build RemoteDesktopHarbor.slnx -c Release --no-restore

      - name: Test
        run: dotnet test RemoteDesktopHarbor.slnx -c Release --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Publish win-x64 (self-contained single file)
        run: dotnet publish src/Harbor.App/Harbor.App.csproj -p:PublishProfile=win-x64 -o artifacts/win-x64

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: RemoteDesktopHarbor-win-x64
          path: artifacts/win-x64/RemoteDesktopHarbor.exe
          if-no-files-found: error
